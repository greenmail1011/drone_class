<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>無人機課程排課表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>
  :root{
    color-scheme:light;
    --ground:#FDF5EE;
    --surface:#FFFFFF;
    --surface-2:#FBEBDC;
    --ink:#3A2317;
    --ink-2:#7A5A44;
    --ink-3:#8B6B4F;
    --line:#F0DCC8;
    --line-2:#E0C3A6;
    --brand:#B0491F;
    --brand-soft:#FBE4D6;
    --on-brand:#FFFFFF;
    --am:#FFCE3D;
    --am-on:#4A3400;
    --am-soft:#FFF4D4;
    --am-edge:#EDC978;
    --pm:#D2401F;
    --pm-on:#FFFFFF;
    --pm-soft:#FBE2DA;
    --pm-edge:#EE9A80;
    --shadow:0 1px 2px rgba(74,45,25,.06), 0 8px 20px -12px rgba(74,45,25,.24);
    --shadow-lift:0 2px 5px rgba(74,45,25,.16), 0 10px 22px -10px rgba(74,45,25,.34);
  }

  *{box-sizing:border-box;}
  body{
    background:var(--ground);
    color:var(--ink);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:36px 64px;}

  /* ---------- header ---------- */
  .eyebrow{
    margin:0 0 10px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--brand);font-weight:700;
  }
  h1{
    font-family:"Noto Serif TC",Georgia,serif;font-weight:700;
    font-size:clamp(28px,4.6vw,42px);line-height:1.18;margin:0 0 12px;
    text-wrap:balance;letter-spacing:.01em;
  }
  .lede{margin:0;max-width:60ch;color:var(--ink-2);font-size:15px;}
  .lede b{color:var(--ink);font-weight:500;}

  /* ---------- stats + toolbar ---------- */
  .bar{
    margin:28px 0 26px;display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;
    justify-content:space-between;
    padding-bottom:20px;border-bottom:1px solid var(--line);
  }
  .stats{display:flex;flex-wrap:wrap;gap:10px;}
  .stat{
    background:var(--surface);border:1px solid var(--line);border-radius:10px;
    padding:10px 14px;min-width:96px;
  }
  .stat .k{display:block;font-size:11px;letter-spacing:.08em;color:var(--ink-3);font-weight:500;}
  .stat .v{
    font-family:"IBM Plex Mono",ui-monospace,monospace;font-weight:600;
    font-size:22px;line-height:1.25;font-variant-numeric:tabular-nums;color:var(--ink);
  }
  .stat .v small{font-size:13px;color:var(--ink-3);font-weight:500;}
  .stat.lead{border-color:var(--pm-edge);background:var(--brand-soft);}
  .stat.lead .v{color:var(--brand);}
  .stat.lead .k{color:var(--brand);}

  .tools{display:flex;flex-wrap:wrap;gap:8px;}
  .btn{
    font:inherit;font-size:13px;font-weight:500;cursor:pointer;
    background:var(--surface);color:var(--ink-2);
    border:1px solid var(--line-2);border-radius:8px;padding:7px 12px;
    transition:border-color .14s,color .14s,background .14s;
  }
  .btn:hover{color:var(--ink);border-color:var(--ink-3);}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand);font-weight:700;}
  .btn.primary:hover{color:var(--on-brand);filter:brightness(1.08);}
  .btn:focus-visible,.chip:focus-visible{outline:2px solid var(--brand);outline-offset:2px;}

  /* ---------- layout ---------- */
  .layout{display:grid;grid-template-columns:minmax(0,1fr) 296px;gap:26px;align-items:start;}
  .months{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:18px;min-width:0;align-items:start;}

  /* ---------- month card ---------- */
  .month{
    background:var(--surface);border:1px solid var(--line);border-radius:12px;
    padding:16px 14px 14px;box-shadow:var(--shadow);min-width:0;
  }
  .month-hd{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:12px;}
  .month-hd h2{
    font-family:"Noto Serif TC",Georgia,serif;font-weight:600;
    font-size:17px;margin:0;letter-spacing:.02em;
  }
  .month-hd h2 span{font-family:"IBM Plex Mono",monospace;font-size:15px;color:var(--ink-3);margin-right:2px;}
  .month-count{
    font-family:"IBM Plex Mono",monospace;font-size:12px;font-variant-numeric:tabular-nums;
    color:var(--ink-3);white-space:nowrap;
  }
  .month-count.some{color:var(--brand);font-weight:600;}

  .dow,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;}
  .dow{margin-bottom:6px;}
  .dow span{
    text-align:center;font-size:11px;color:var(--ink-3);font-weight:500;padding-bottom:4px;
    border-bottom:1px solid var(--line);
  }
  .dow span.wk{color:var(--ink-3);opacity:.6;}

  .cell{min-height:34px;border-radius:7px;padding:2px;}
  .cell.blank{visibility:hidden;}
  .dnum{
    font-family:"IBM Plex Mono",monospace;font-size:12px;font-variant-numeric:tabular-nums;
    color:var(--ink-3);text-align:center;line-height:1.5;
  }
  .cell.wk .dnum{opacity:.45;}

  .cell.slot{
    background:var(--surface-2);border:1px solid var(--line);
    padding:4px 3px 5px;min-height:74px;
    transition:border-color .14s,background .14s;
  }
  .cell.slot .dnum{color:var(--ink);font-weight:600;font-size:13px;}
  .cell.slot.active{border-color:var(--pm-edge);background:var(--surface);box-shadow:0 0 0 2px var(--pm-soft);}

  .chips{display:flex;flex-direction:column;gap:3px;margin-top:4px;}
  .chip{
    font:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:3px;
    width:100%;padding:3px 2px;border-radius:5px;
    font-size:11px;font-weight:500;line-height:1.35;
    background:transparent;color:var(--ink-2);
    border:1px dashed var(--line-2);
    transition:transform .12s ease,box-shadow .12s ease,background .12s,color .12s,border-color .12s;
  }
  .chip .tick{
    font-size:11px;font-weight:700;line-height:1;
    opacity:0;transform:scale(.5);transition:opacity .12s,transform .16s cubic-bezier(.2,1.4,.4,1);
  }
  .chip .lbl-s{display:none;}
  .chip.am:hover{color:var(--am);border-color:var(--am-edge);background:var(--am-soft);}
  .chip.pm:hover{color:var(--pm);border-color:var(--pm-edge);background:var(--pm-soft);}

  .chip[aria-pressed="true"]{
    border-style:solid;font-weight:700;
    box-shadow:var(--shadow-lift);transform:translateY(-1px);
  }
  .chip[aria-pressed="true"] .tick{opacity:1;transform:scale(1);}
  .chip.am[aria-pressed="true"]{background:var(--am);border-color:var(--am);color:var(--am-on);}
  .chip.pm[aria-pressed="true"]{background:var(--pm);border-color:var(--pm);color:var(--pm-on);}
  .chip.am[aria-pressed="true"]:hover{color:var(--am-on);background:var(--am);}
  .chip.pm[aria-pressed="true"]:hover{color:var(--pm-on);background:var(--pm);}

  .cellnote{
    font-size:9px;line-height:1.35;color:var(--ink-3);text-align:center;margin-top:4px;word-break:keep-all;
    letter-spacing:.02em;
  }

  /* ---------- summary panel ---------- */
  .panel{
    background:var(--surface);border:1px solid var(--line);border-radius:12px;
    padding:18px 16px;box-shadow:var(--shadow);position:sticky;top:20px;min-width:0;
  }
  .panel h2{
    font-family:"Noto Serif TC",Georgia,serif;font-size:16px;font-weight:600;margin:0 0 2px;
  }
  .panel .sub{margin:0 0 14px;font-size:12px;color:var(--ink-3);}
  .picked{list-style:none;margin:0 0 14px;padding:0;max-height:46vh;overflow-y:auto;}
  .picked li{
    display:flex;align-items:center;gap:8px;padding:5px 0;
    border-bottom:1px dotted var(--line);font-size:13px;
  }
  .picked li:last-child{border-bottom:0;}
  .picked .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;}
  .picked .dot.am{background:var(--am);}
  .picked .dot.pm{background:var(--pm);}
  .picked .dt{
    font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;
    color:var(--ink);font-weight:500;
  }
  .picked .pt{color:var(--ink-2);font-size:12px;margin-left:auto;}
  .empty{
    font-size:13px;color:var(--ink-3);background:var(--surface-2);
    border-radius:8px;padding:14px;text-align:center;margin-bottom:14px;
  }
  .legend{display:flex;gap:14px;font-size:12px;color:var(--ink-2);margin-top:14px;padding-top:12px;border-top:1px solid var(--line);}
  .legend span{display:flex;align-items:center;gap:5px;}
  .legend i{width:10px;height:10px;border-radius:3px;display:inline-block;}
  .legend i.am{background:var(--am);}
  .legend i.pm{background:var(--pm);}
  .sync{font-size:11px;color:var(--ink-3);margin-top:10px;display:flex;align-items:center;gap:6px;}
  .sync i{width:6px;height:6px;border-radius:50%;background:var(--ink-3);display:inline-block;}
  .sync.ok i{background:var(--brand);}

  .toast{
    position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);
    background:var(--ink);color:var(--ground);font-size:13px;font-weight:500;
    padding:9px 16px;border-radius:999px;opacity:0;pointer-events:none;
    transition:opacity .2s,transform .2s;z-index:20;
  }
  .toast.show{opacity:1;transform:translate(-50%,0);}

  @media (max-width:960px){
    .layout{grid-template-columns:1fr;}
    .panel{position:static;}
    .picked{max-height:none;}
  }
  @media (max-width:520px){
    .wrap{padding-block:26px 48px;}
    .months{grid-template-columns:1fr;}
    .chip .lbl-f{display:none;}
    .chip .lbl-s{display:inline;}
    .stat{min-width:78px;padding:8px 11px;}
    .stat .v{font-size:19px;}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition-duration:.01ms !important;animation-duration:.01ms !important;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">生活輔導中心 · 無人機課程</p>
    <h1>無人機課程排課表</h1>
    <p class="lede">把可以開課的時段勾起來。共 <b>26 天</b>（週二 17 天、週五 9 天）、<b>37 個時段</b>；標「整天」的日期拆成早上與下午，可以各自勾選。<br>勾選會自動記住，下次打開還在。</p>
  </header>

  <div class="bar">
    <div class="stats">
      <div class="stat lead"><span class="k">已選時段</span><span class="v" id="s-total">0<small> / 37</small></span></div>
      <div class="stat"><span class="k">週二</span><span class="v" id="s-tue">0<small> / 27</small></span></div>
      <div class="stat"><span class="k">週五</span><span class="v" id="s-fri">0<small> / 10</small></span></div>
      <div class="stat"><span class="k">上課日數</span><span class="v" id="s-days">0<small> / 26</small></span></div>
    </div>
    <div class="tools">
      <button class="btn" type="button" data-act="all">全選</button>
      <button class="btn" type="button" data-act="tue">週二全選</button>
      <button class="btn" type="button" data-act="fri">週五全選</button>
      <button class="btn" type="button" data-act="clear">清除</button>
    </div>
  </div>

  <div class="layout">
    <main class="months" id="months"></main>
    <aside class="panel">
      <h2>已選清單</h2>
      <p class="sub" id="panel-sub">尚未勾選</p>
      <div id="picked-wrap"></div>
      <button class="btn primary" type="button" id="copy" style="width:100%">複製清單</button>
      <div class="legend">
        <span><i class="am"></i>早上</span>
        <span><i class="pm"></i>下午</span>
      </div>
      <div class="sync" id="sync"><i></i><span>載入中…</span></div>
    </aside>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  "use strict";

  var SLOTS = [
    {d:"2026-09-18", p:["pm"]},
    {d:"2026-09-22", p:["pm"]},
    {d:"2026-09-29", p:["pm"]},
    {d:"2026-10-06", p:["am","pm"]},
    {d:"2026-10-13", p:["am"]},
    {d:"2026-10-16", p:["pm"]},
    {d:"2026-10-20", p:["am","pm"]},
    {d:"2026-10-23", p:["am"]},
    {d:"2026-10-27", p:["am","pm"]},
    {d:"2026-11-03", p:["am","pm"]},
    {d:"2026-11-06", p:["am","pm"]},
    {d:"2026-11-10", p:["pm"]},
    {d:"2026-11-13", p:["pm"]},
    {d:"2026-11-17", p:["am","pm"]},
    {d:"2026-11-24", p:["pm"]},
    {d:"2026-12-01", p:["am","pm"]},
    {d:"2026-12-08", p:["pm"]},
    {d:"2026-12-11", p:["pm"]},
    {d:"2026-12-15", p:["am","pm"]},
    {d:"2026-12-18", p:["am"]},
    {d:"2026-12-22", p:["am","pm"]},
    {d:"2026-12-29", p:["pm"]},
    {d:"2027-01-05", p:["am","pm"], note:"輔諮慶功宴"},
    {d:"2027-01-08", p:["pm"]},
    {d:"2027-01-12", p:["am","pm"]},
    {d:"2027-01-15", p:["pm"]}
  ];

  var MONTHS = [[2026,9],[2026,10],[2026,11],[2026,12],[2027,1]];
  var DOW = ["日","一","二","三","四","五","六"];
  var PART = {am:"早上", pm:"下午"};
  var PART_S = {am:"早", pm:"午"};
  var LS_KEY = "drone-course-schedule-v1";

  var byDate = {};
  SLOTS.forEach(function(s){ byDate[s.d] = s; });

  function wd(iso){
    var a = iso.split("-");
    return new Date(Date.UTC(+a[0], +a[1]-1, +a[2])).getUTCDay();
  }
  function key(d, p){ return d + "|" + p; }

  var ALL_KEYS = [];
  SLOTS.forEach(function(s){ s.p.forEach(function(p){ ALL_KEYS.push(key(s.d,p)); }); });

  var picks = {};
  var chipEls = {};
  var cellEls = {};
  var monthCountEls = {};

  /* ---------- build the calendars ---------- */
  var host = document.getElementById("months");
  MONTHS.forEach(function(m){
    var y = m[0], mo = m[1];
    var sec = document.createElement("section");
    sec.className = "month";

    var total = 0;
    SLOTS.forEach(function(s){
      var a = s.d.split("-");
      if (+a[0] === y && +a[1] === mo) total += s.p.length;
    });

    var hd = document.createElement("div");
    hd.className = "month-hd";
    hd.innerHTML = '<h2><span>' + y + '</span> ' + mo + ' 月</h2>' +
                   '<span class="month-count" data-total="' + total + '">0 / ' + total + '</span>';
    sec.appendChild(hd);
    monthCountEls[y + "-" + mo] = hd.querySelector(".month-count");

    var dow = document.createElement("div");
    dow.className = "dow";
    DOW.forEach(function(t, i){
      var sp = document.createElement("span");
      sp.textContent = t;
      if (i === 0 || i === 6) sp.className = "wk";
      dow.appendChild(sp);
    });
    sec.appendChild(dow);

    var grid = document.createElement("div");
    grid.className = "grid";
    var first = new Date(Date.UTC(y, mo-1, 1)).getUTCDay();
    var ndays = new Date(Date.UTC(y, mo, 0)).getUTCDate();

    for (var b = 0; b < first; b++){
      var blank = document.createElement("div");
      blank.className = "cell blank";
      grid.appendChild(blank);
    }

    for (var day = 1; day <= ndays; day++){
      var iso = y + "-" + String(mo).padStart(2,"0") + "-" + String(day).padStart(2,"0");
      var cell = document.createElement("div");
      cell.className = "cell";
      var w = wd(iso);
      if (w === 0 || w === 6) cell.className += " wk";

      var num = document.createElement("div");
      num.className = "dnum";
      num.textContent = day;
      cell.appendChild(num);

      var slot = byDate[iso];
      if (slot){
        cell.className += " slot";
        cellEls[iso] = cell;
        var chips = document.createElement("div");
        chips.className = "chips";
        slot.p.forEach(function(p){
          var k = key(iso, p);
          var btn = document.createElement("button");
          btn.type = "button";
          btn.className = "chip " + p;
          btn.dataset.k = k;
          btn.setAttribute("aria-pressed", "false");
          btn.setAttribute("aria-label", iso + " " + PART[p]);
          btn.innerHTML = '<span class="tick" aria-hidden="true">✓</span>' +
                          '<span class="lbl-f">' + PART[p] + '</span>' +
                          '<span class="lbl-s">' + PART_S[p] + '</span>';
          chips.appendChild(btn);
          chipEls[k] = btn;
        });
        cell.appendChild(chips);
        if (slot.note){
          var n = document.createElement("div");
          n.className = "cellnote";
          n.textContent = slot.note;
          cell.appendChild(n);
        }
      }
      grid.appendChild(cell);
    }
    sec.appendChild(grid);
    host.appendChild(sec);
  });

  /* ---------- painting ---------- */
  var elTotal = document.getElementById("s-total");
  var elTue = document.getElementById("s-tue");
  var elFri = document.getElementById("s-fri");
  var elDays = document.getElementById("s-days");
  var elSub = document.getElementById("panel-sub");
  var elPicked = document.getElementById("picked-wrap");

  function selectedKeys(){
    return ALL_KEYS.filter(function(k){ return picks[k]; });
  }

  function paint(){
    var counts = {}, days = {}, tue = 0, fri = 0;

    ALL_KEYS.forEach(function(k){
      var on = !!picks[k];
      var btn = chipEls[k];
      if (btn) btn.setAttribute("aria-pressed", on ? "true" : "false");
      if (!on) return;
      var d = k.split("|")[0];
      days[d] = true;
      var a = d.split("-");
      var mk = (+a[0]) + "-" + (+a[1]);
      counts[mk] = (counts[mk] || 0) + 1;
      if (wd(d) === 2) tue++; else fri++;
    });

    Object.keys(cellEls).forEach(function(d){
      cellEls[d].classList.toggle("active", !!days[d]);
    });

    Object.keys(monthCountEls).forEach(function(mk){
      var el = monthCountEls[mk];
      var n = counts[mk] || 0;
      el.textContent = n + " / " + el.dataset.total;
      el.classList.toggle("some", n > 0);
    });

    var sel = selectedKeys();
    elTotal.innerHTML = sel.length + '<small> / 37</small>';
    elTue.innerHTML = tue + '<small> / 27</small>';
    elFri.innerHTML = fri + '<small> / 10</small>';
    elDays.innerHTML = Object.keys(days).length + '<small> / 26</small>';

    if (!sel.length){
      elSub.textContent = "尚未勾選";
      elPicked.innerHTML = '<div class="empty">點月曆上的<br>「早上」「下午」開始排課</div>';
    } else {
      elSub.textContent = "共 " + sel.length + " 個時段，" + Object.keys(days).length + " 個上課日";
      var ul = ['<ul class="picked">'];
      sel.forEach(function(k){
        var a = k.split("|"), d = a[0], p = a[1], dd = d.split("-");
        ul.push('<li><span class="dot ' + p + '"></span>' +
                '<span class="dt">' + dd[1] + "/" + dd[2] + '</span>' +
                '<span class="pt">（' + DOW[wd(d)] + '）' + PART[p] + '</span></li>');
      });
      ul.push("</ul>");
      elPicked.innerHTML = ul.join("");
    }
  }

  /* ---------- interaction ---------- */
  host.addEventListener("click", function(e){
    var btn = e.target.closest(".chip");
    if (!btn) return;
    var k = btn.dataset.k;
    if (picks[k]) delete picks[k]; else picks[k] = true;
    paint();
    save();
  });

  document.querySelector(".tools").addEventListener("click", function(e){
    var b = e.target.closest("[data-act]");
    if (!b) return;
    var act = b.dataset.act;
    if (act === "clear") picks = {};
    if (act === "all") ALL_KEYS.forEach(function(k){ picks[k] = true; });
    if (act === "tue" || act === "fri"){
      var want = act === "tue" ? 2 : 5;
      ALL_KEYS.forEach(function(k){
        if (wd(k.split("|")[0]) === want) picks[k] = true;
      });
    }
    paint();
    save();
  });

  var toast = document.getElementById("toast"), toastT = null;
  function say(msg){
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(toastT);
    toastT = setTimeout(function(){ toast.classList.remove("show"); }, 1900);
  }

  document.getElementById("copy").addEventListener("click", function(){
    var sel = selectedKeys();
    if (!sel.length){ say("還沒有勾選任何時段"); return; }
    var lines = ["無人機課程 上課時段（共 " + sel.length + " 個）", ""];
    sel.forEach(function(k){
      var a = k.split("|"), d = a[0], dd = d.split("-");
      lines.push(dd[0] + "/" + dd[1] + "/" + dd[2] + "（" + DOW[wd(d)] + "）" + PART[a[1]]);
    });
    var text = lines.join("\n");
    var done = function(){ say("已複製 " + sel.length + " 個時段"); };
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done, function(){ fallback(text, done); });
    } else {
      fallback(text, done);
    }
  });

  function fallback(text, done){
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.cssText = "position:fixed;top:-1000px;left:0;opacity:0";
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch(err){ ok = false; }
    document.body.removeChild(ta);
    if (ok) done(); else say("無法複製，請手動選取清單");
  }

  /* ---------- persistence ---------- */
  var syncEl = document.getElementById("sync");
  function setSync(state, label){
    syncEl.classList.toggle("ok", state === "ok");
    syncEl.querySelector("span").textContent = label;
  }
  function stamp(iso){
    var t = iso ? new Date(iso) : new Date();
    if (isNaN(t.getTime())) t = new Date();
    var pad = function(n){ return String(n).padStart(2,"0"); };
    return pad(t.getMonth()+1) + "/" + pad(t.getDate()) + " " + pad(t.getHours()) + ":" + pad(t.getMinutes());
  }
  function savedAt(iso){ setSync("ok", "已自動儲存 · " + stamp(iso)); }

  function readLocal(){
    try {
      var raw = localStorage.getItem(LS_KEY);
      if (raw) return JSON.parse(raw) || {};
    } catch(err){}
    return {};
  }
  function writeLocal(){
    try { localStorage.setItem(LS_KEY, JSON.stringify(picks)); } catch(err){}
  }

  var docRef = null, pending = 0, saveT = null, seeded = false;

  function save(){
    writeLocal();
    if (!docRef){ setSync("local", "已存在這台裝置 · " + stamp()); return; }
    pending++;
    setSync("saving", "儲存中…");
    clearTimeout(saveT);
    saveT = setTimeout(function(){
      var snapshot = {};
      Object.keys(picks).forEach(function(k){ snapshot[k] = true; });
      var n = pending;
      docRef.set({ picks: snapshot, updatedAt: new Date().toISOString() }).then(function(){
        pending -= n;
        if (pending < 0) pending = 0;
        savedAt();
      }, function(){
        pending -= n;
        if (pending < 0) pending = 0;
        setSync("local", "已存在這台裝置（未同步）");
      });
    }, 450);
  }

  picks = readLocal();
  paint();
  setSync("local", Object.keys(picks).length ? "已存在這台裝置" : "尚未儲存");

  if (window.claude && typeof window.claude.use === "function"){
    window.claude.use("db").then(function(db){
      if (!db) return;
      docRef = db.doc("schedule/selections");
      docRef.onSnapshot(function(snap){
        if (pending > 0) return;
        var data = snap.exists ? snap.data() : null;
        var remote = (data && data.picks) ? data.picks : null;
        if (!seeded){
          seeded = true;
          if (!remote || !Object.keys(remote).length){
            if (Object.keys(picks).length){ save(); return; }
            setSync("ok", "已連線，勾選會自動儲存");
            return;
          }
        }
        picks = {};
        if (remote) Object.keys(remote).forEach(function(k){ if (remote[k]) picks[k] = true; });
        writeLocal();
        paint();
        savedAt(data && data.updatedAt);
      }, function(){ setSync("local", "已存在這台裝置（未同步）"); });
    }, function(){});
  }
})();
</script>
</body>
</html>
