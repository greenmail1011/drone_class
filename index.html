<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>無人機課程排課表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>
  :root{
    color-scheme:light;
    --ground:#FDF5EE;
    --surface:#FFFFFF;
    --surface-2:#FBEBDC;
    --ink:#3A2317;
    --ink-2:#7A5A44;
    --ink-3:#8B6B4F;
    --line:#F0DCC8;
    --line-2:#E0C3A6;
    --brand:#B0491F;
    --brand-soft:#FBE4D6;
    --on-brand:#FFFFFF;
    --am:#FFCE3D;
    --am-on:#4A3400;
    --am-soft:#FFF4D4;
    --am-edge:#EDC978;
    --pm:#D2401F;
    --pm-on:#FFFFFF;
    --pm-soft:#FBE2DA;
    --pm-edge:#EE9A80;
    --shadow:0 1px 2px rgba(74,45,25,.06), 0 8px 20px -12px rgba(74,45,25,.24);
    --shadow-lift:0 2px 5px rgba(74,45,25,.16), 0 10px 22px -10px rgba(74,45,25,.34);
  }

  *{box-sizing:border-box;}
  body{
    background:var(--ground);
    color:var(--ink);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:36px 64px;}

  /* ---------- header ---------- */
  .eyebrow{
    margin:0 0 10px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--brand);font-weight:700;
  }
  h1{
    font-family:"Noto Serif TC",Georgia,serif;font-weight:700;
    font-size:clamp(28px,4.6vw,42px);line-height:1.18;margin:0 0 12px;
    text-wrap:balance;letter-spacing:.01em;
  }
  /* ---------- stats + toolbar ---------- */
  .bar{
    margin:28px 0 26px;display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;
    justify-content:space-between;
    padding-bottom:20px;border-bottom:1px solid var(--line);
  }
  .stats{display:flex;flex-wrap:wrap;gap:10px;}
  .stat{
    background:var(--surface);border:1px solid var(--line);border-radius:10px;
    padding:10px 14px;min-width:96px;
  }
  .stat .k{display:block;font-size:11px;letter-spacing:.08em;color:var(--ink-3);font-weight:500;}
  .stat .v{
    font-family:"IBM Plex Mono",ui-monospace,monospace;font-weight:600;
    font-size:22px;line-height:1.25;font-variant-numeric:tabular-nums;color:var(--ink);
  }
  .stat .v small{font-size:13px;color:var(--ink-3);font-weight:500;}
  .stat.lead{border-color:var(--pm-edge);background:var(--brand-soft);}
  .stat.lead .v{color:var(--brand);}
  .stat.lead .k{color:var(--brand);}

  .btn:focus-visible,.chip:focus-visible{outline:2px solid var(--brand);outline-offset:2px;}

  .months{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:18px;min-width:0;align-items:start;}

  /* ---------- month card ---------- */
  .month{
    background:var(--surface);border:1px solid var(--line);border-radius:12px;
    padding:16px 14px 14px;box-shadow:var(--shadow);min-width:0;
  }
  .month-hd{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:12px;}
  .month-hd h2{
    font-family:"Noto Serif TC",Georgia,serif;font-weight:600;
    font-size:17px;margin:0;letter-spacing:.02em;
  }
  .month-hd h2 span{font-family:"IBM Plex Mono",monospace;font-size:15px;color:var(--ink-3);margin-right:2px;}
  .month-count{
    font-family:"IBM Plex Mono",monospace;font-size:12px;font-variant-numeric:tabular-nums;
    color:var(--ink-3);white-space:nowrap;
  }
  .month-count.some{color:var(--brand);font-weight:600;}

  .dow,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;}
  .dow{margin-bottom:6px;}
  .dow span{
    text-align:center;font-size:11px;color:var(--ink-3);font-weight:500;padding-bottom:4px;
    border-bottom:1px solid var(--line);
  }
  .dow span.wk{color:var(--ink-3);opacity:.6;}

  .cell{min-height:34px;border-radius:7px;padding:2px;}
  .cell.blank{visibility:hidden;}
  .dnum{
    font-family:"IBM Plex Mono",monospace;font-size:12px;font-variant-numeric:tabular-nums;
    color:var(--ink-3);text-align:center;line-height:1.5;
  }
  .cell.wk .dnum{opacity:.45;}

  .cell.slot{
    background:var(--surface-2);border:1px solid var(--line);
    padding:4px 3px 5px;min-height:74px;
    transition:border-color .14s,background .14s;
  }
  .cell.slot .dnum{color:var(--ink);font-weight:600;font-size:13px;}
  .cell.slot.active{border-color:var(--pm-edge);background:var(--surface);box-shadow:0 0 0 2px var(--pm-soft);}

  .chips{display:flex;flex-direction:column;gap:3px;margin-top:4px;}
  .chip{
    font:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:3px;
    width:100%;padding:3px 2px;border-radius:5px;
    font-size:11px;font-weight:500;line-height:1.35;white-space:nowrap;
    background:transparent;color:var(--ink-2);
    border:1px dashed var(--line-2);
    transition:transform .12s ease,box-shadow .12s ease,background .12s,color .12s,border-color .12s;
  }
  .chip .tick{
    font-size:11px;font-weight:700;line-height:1;
    opacity:0;transform:scale(.5);transition:opacity .12s,transform .16s cubic-bezier(.2,1.4,.4,1);
  }
  .chip .lbl-s{display:none;}
  .chip.am:hover{color:var(--am);border-color:var(--am-edge);background:var(--am-soft);}
  .chip.pm:hover{color:var(--pm);border-color:var(--pm-edge);background:var(--pm-soft);}

  .chip[aria-pressed="true"]{
    border-style:solid;font-weight:700;
    box-shadow:var(--shadow-lift);transform:translateY(-1px);
  }
  .chip[aria-pressed="true"] .tick{opacity:1;transform:scale(1);}
  .chip.am[aria-pressed="true"]{background:var(--am);border-color:var(--am);color:var(--am-on);}
  .chip.pm[aria-pressed="true"]{background:var(--pm);border-color:var(--pm);color:var(--pm-on);}
  .chip.am[aria-pressed="true"]:hover{color:var(--am-on);background:var(--am);}
  .chip.pm[aria-pressed="true"]:hover{color:var(--pm-on);background:var(--pm);}

  .cellnote{
    font-size:9px;line-height:1.35;color:var(--ink-3);text-align:center;margin-top:4px;word-break:keep-all;
    letter-spacing:.02em;
  }

  @media (max-width:520px){
    .wrap{padding-block:26px 48px;}
    .months{grid-template-columns:1fr;}
    .chip .lbl-f{display:none;}
    .chip .lbl-s{display:inline;}
    .stat{min-width:78px;padding:8px 11px;}
    .stat .v{font-size:19px;}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition-duration:.01ms !important;animation-duration:.01ms !important;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">生活輔導中心 · 無人機課程</p>
    <h1>無人機課程排課表</h1>
  </header>

  <div class="bar">
    <div class="stats">
      <div class="stat lead"><span class="k">已選時段</span><span class="v" id="s-total">0<small> / 29</small></span></div>
      <div class="stat"><span class="k">週二</span><span class="v" id="s-tue">0<small> / 27</small></span></div>
      <div class="stat"><span class="k">週五</span><span class="v" id="s-fri">0<small> / 2</small></span></div>
      <div class="stat"><span class="k">上課日數</span><span class="v" id="s-days">0<small> / 19</small></span></div>
    </div>
  </div>

  <main class="months" id="months"></main>
</div>

<script>
(function(){
  "use strict";

  /* =====================================================================
     共用資料庫（Firebase Realtime Database，REST + EventSource，無需函式庫）
     ---------------------------------------------------------------------
     專案：drone-course-schedule ／ 地區：asia-southeast1
     規則（Realtime Database → 規則）目前為：
       { "rules": { "schedule": { ".read": true, ".write": true } } }
     只有 /schedule 這個節點可讀寫，其他路徑一律拒絕，且不會過期。
     知道網址的人都能改，內部排課用；不要放個資或機密。
     把 DB_URL 清成 "" 就會退回「只存在這台裝置」的模式。
     ===================================================================== */
  var DB_URL  = "https://drone-course-schedule-default-rtdb.asia-southeast1.firebasedatabase.app";
  var DB_PATH = "/schedule/selections";


  var SLOTS = [
    {d:"2026-09-22", p:["pm"]},
    {d:"2026-09-29", p:["pm"], note:"精油課－待確認個案狀況"},
    {d:"2026-10-06", p:["am","pm"]},
    {d:"2026-10-13", p:["am"]},
    {d:"2026-10-16", p:["pm"]},
    {d:"2026-10-20", p:["am","pm"]},
    {d:"2026-10-23", p:["am"]},
    {d:"2026-10-27", p:["am","pm"]},
    {d:"2026-11-03", p:["am","pm"]},
    {d:"2026-11-10", p:["pm"]},
    {d:"2026-11-17", p:["am","pm"]},
    {d:"2026-11-24", p:["pm"]},
    {d:"2026-12-01", p:["am","pm"]},
    {d:"2026-12-08", p:["pm"]},
    {d:"2026-12-15", p:["am","pm"]},
    {d:"2026-12-22", p:["am","pm"]},
    {d:"2026-12-29", p:["pm"]},
    {d:"2027-01-05", p:["am","pm"], note:"輔諮慶功宴"},
    {d:"2027-01-12", p:["am","pm"]}
  ];

  var MONTHS = [[2026,9],[2026,10],[2026,11],[2026,12],[2027,1]];
  var DOW = ["日","一","二","三","四","五","六"];
  var PART = {am:"早上", pm:"下午"};
  var PART_S = {am:"早", pm:"午"};
  var LS_KEY = "drone-course-schedule-v1";

  var byDate = {};
  SLOTS.forEach(function(s){ byDate[s.d] = s; });

  function wd(iso){
    var a = iso.split("-");
    return new Date(Date.UTC(+a[0], +a[1]-1, +a[2])).getUTCDay();
  }
  function key(d, p){ return d + "|" + p; }

  var ALL_KEYS = [];
  SLOTS.forEach(function(s){ s.p.forEach(function(p){ ALL_KEYS.push(key(s.d,p)); }); });

  var TOT = ALL_KEYS.length;
  var TUE_TOT = 0;
  ALL_KEYS.forEach(function(k){ if (wd(k.split("|")[0]) === 2) TUE_TOT++; });
  var FRI_TOT = TOT - TUE_TOT;
  var DAY_TOT = SLOTS.length;
  var TUE_DAYS = 0;
  SLOTS.forEach(function(s){ if (wd(s.d) === 2) TUE_DAYS++; });
  var FRI_DAYS = DAY_TOT - TUE_DAYS;

  var picks = {};
  var chipEls = {};
  var cellEls = {};
  var monthCountEls = {};

  /* ---------- build the calendars ---------- */
  var host = document.getElementById("months");
  MONTHS.forEach(function(m){
    var y = m[0], mo = m[1];
    var sec = document.createElement("section");
    sec.className = "month";

    var total = 0;
    SLOTS.forEach(function(s){
      var a = s.d.split("-");
      if (+a[0] === y && +a[1] === mo) total += s.p.length;
    });

    var hd = document.createElement("div");
    hd.className = "month-hd";
    hd.innerHTML = '<h2><span>' + y + '</span> ' + mo + ' 月</h2>' +
                   '<span class="month-count" data-total="' + total + '">0 / ' + total + '</span>';
    sec.appendChild(hd);
    monthCountEls[y + "-" + mo] = hd.querySelector(".month-count");

    var dow = document.createElement("div");
    dow.className = "dow";
    DOW.forEach(function(t, i){
      var sp = document.createElement("span");
      sp.textContent = t;
      if (i === 0 || i === 6) sp.className = "wk";
      dow.appendChild(sp);
    });
    sec.appendChild(dow);

    var grid = document.createElement("div");
    grid.className = "grid";
    var first = new Date(Date.UTC(y, mo-1, 1)).getUTCDay();
    var ndays = new Date(Date.UTC(y, mo, 0)).getUTCDate();

    for (var b = 0; b < first; b++){
      var blank = document.createElement("div");
      blank.className = "cell blank";
      grid.appendChild(blank);
    }

    for (var day = 1; day <= ndays; day++){
      var iso = y + "-" + String(mo).padStart(2,"0") + "-" + String(day).padStart(2,"0");
      var cell = document.createElement("div");
      cell.className = "cell";
      var w = wd(iso);
      if (w === 0 || w === 6) cell.className += " wk";

      var num = document.createElement("div");
      num.className = "dnum";
      num.textContent = day;
      cell.appendChild(num);

      var slot = byDate[iso];
      if (slot){
        cell.className += " slot";
        cellEls[iso] = cell;
        var chips = document.createElement("div");
        chips.className = "chips";
        slot.p.forEach(function(p){
          var k = key(iso, p);
          var btn = document.createElement("button");
          btn.type = "button";
          btn.className = "chip " + p;
          btn.dataset.k = k;
          btn.setAttribute("aria-pressed", "false");
          btn.setAttribute("aria-label", iso + " " + PART[p]);
          btn.innerHTML = '<span class="tick" aria-hidden="true">✓</span>' +
                          '<span class="lbl-f">' + PART[p] + '</span>' +
                          '<span class="lbl-s">' + PART_S[p] + '</span>';
          chips.appendChild(btn);
          chipEls[k] = btn;
        });
        cell.appendChild(chips);
        if (slot.note){
          var n = document.createElement("div");
          n.className = "cellnote";
          n.textContent = slot.note;
          n.title = slot.note;
          cell.appendChild(n);
        }
      }
      grid.appendChild(cell);
    }
    sec.appendChild(grid);
    host.appendChild(sec);
  });

  /* ---------- painting ---------- */
  var elTotal = document.getElementById("s-total");
  var elTue = document.getElementById("s-tue");
  var elFri = document.getElementById("s-fri");
  var elDays = document.getElementById("s-days");
  function selectedKeys(){
    return ALL_KEYS.filter(function(k){ return picks[k]; });
  }

  function paint(){
    var counts = {}, days = {}, tue = 0, fri = 0;

    ALL_KEYS.forEach(function(k){
      var on = !!picks[k];
      var btn = chipEls[k];
      if (btn) btn.setAttribute("aria-pressed", on ? "true" : "false");
      if (!on) return;
      var d = k.split("|")[0];
      days[d] = true;
      var a = d.split("-");
      var mk = (+a[0]) + "-" + (+a[1]);
      counts[mk] = (counts[mk] || 0) + 1;
      if (wd(d) === 2) tue++; else fri++;
    });

    Object.keys(cellEls).forEach(function(d){
      cellEls[d].classList.toggle("active", !!days[d]);
    });

    Object.keys(monthCountEls).forEach(function(mk){
      var el = monthCountEls[mk];
      var n = counts[mk] || 0;
      el.textContent = n + " / " + el.dataset.total;
      el.classList.toggle("some", n > 0);
    });

    var sel = selectedKeys();
    elTotal.innerHTML = sel.length + '<small> / ' + TOT + '</small>';
    elTue.innerHTML = tue + '<small> / ' + TUE_TOT + '</small>';
    elFri.innerHTML = fri + '<small> / ' + FRI_TOT + '</small>';
    elDays.innerHTML = Object.keys(days).length + '<small> / ' + DAY_TOT + '</small>';

  }

  /* ---------- interaction ---------- */
  host.addEventListener("click", function(e){
    var btn = e.target.closest(".chip");
    if (!btn) return;
    var k = btn.dataset.k;
    if (picks[k]) delete picks[k]; else picks[k] = true;
    paint();
    save();
  });

  /* ---------- persistence ---------- */
  var syncEl = document.getElementById("sync");
  function setSync(state, label){
    if (!syncEl) return;
    syncEl.classList.toggle("ok", state === "ok");
    syncEl.classList.toggle("warn", state === "warn");
    syncEl.querySelector("span").textContent = label;
  }
  function stamp(iso){
    var t = iso ? new Date(iso) : new Date();
    if (isNaN(t.getTime())) t = new Date();
    var pad = function(n){ return String(n).padStart(2,"0"); };
    return pad(t.getMonth()+1) + "/" + pad(t.getDate()) + " " + pad(t.getHours()) + ":" + pad(t.getMinutes());
  }
  function savedAt(iso, label){ setSync("ok", (label || "已同步") + " · " + stamp(iso)); }

  function readLocal(){
    try {
      var raw = localStorage.getItem(LS_KEY);
      if (raw){
        var o = JSON.parse(raw) || {}, clean = {};
        ALL_KEYS.forEach(function(k){ if (o[k]) clean[k] = true; });
        return clean;
      }
    } catch(err){}
    return {};
  }
  function writeLocal(){
    try { localStorage.setItem(LS_KEY, JSON.stringify(picks)); } catch(err){}
  }

  var mode = "local";
  var remoteKnown = {};
  var pendingWrites = 0;
  var saveT = null, refreshT = null;

  function save(){
    writeLocal();
    if (mode === "cloud"){
      setSync("wait", "儲存中…");
      clearTimeout(saveT);
      saveT = setTimeout(pushCloud, 400);
      return;
    }
    if (mode === "claude"){
      setSync("wait", "儲存中…");
      clearTimeout(saveT);
      saveT = setTimeout(pushClaude, 400);
      return;
    }
    setSync("local", "已存在這台裝置 · " + stamp());
  }

  function adoptRemote(obj, iso, label){
    picks = {}; remoteKnown = {};
    if (obj) ALL_KEYS.forEach(function(k){
      if (obj[k]) { picks[k] = true; remoteKnown[k] = true; }
    });
    writeLocal();
    paint();
    savedAt(iso, label);
  }

  /* --- A. 共用雲端資料庫（Firebase Realtime Database REST，不需要任何函式庫） --- */
  function dbUrl(){ return DB_URL.replace(/\/+$/, "") + DB_PATH; }

  function cloudRefresh(){
    if (pendingWrites > 0) return;
    fetch(dbUrl() + ".json", { cache: "no-store" })
      .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(d){
        if (pendingWrites > 0) return;
        adoptRemote(d && d.picks, d && d.meta && d.meta.updatedAt, "多人共用 · 已同步");
      })
      .catch(function(){ setSync("warn", "連不到雲端，暫存在這台裝置"); });
  }

  function pushCloud(){
    var body = {}, changed = false;
    ALL_KEYS.forEach(function(k){
      var want = !!picks[k], have = !!remoteKnown[k];
      if (want !== have){ body["picks/" + k] = want ? true : null; changed = true; }
    });
    if (!changed){ savedAt(null, "多人共用 · 已同步"); return; }
    body["meta/updatedAt"] = new Date().toISOString();
    pendingWrites++;
    fetch(dbUrl() + ".json", {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    }).then(function(r){
      if (!r.ok) throw new Error(r.status);
      ALL_KEYS.forEach(function(k){ if (picks[k]) remoteKnown[k] = true; else delete remoteKnown[k]; });
      savedAt(null, "多人共用 · 已同步");
    }).catch(function(){
      setSync("warn", "雲端儲存失敗，暫存在這台裝置");
    }).then(function(){
      pendingWrites--;
      if (pendingWrites < 0) pendingWrites = 0;
    });
  }

  function startCloud(){
    mode = "cloud";
    setSync("wait", "連線中…");
    cloudRefresh();
    if (typeof EventSource === "function"){
      try {
        var es = new EventSource(dbUrl() + ".json");
        var bump = function(){
          clearTimeout(refreshT);
          refreshT = setTimeout(cloudRefresh, 200);
        };
        es.addEventListener("put", bump);
        es.addEventListener("patch", bump);
        es.addEventListener("cancel", function(){ setSync("warn", "資料庫規則不允許讀取"); });
        es.onerror = function(){ /* EventSource 會自己重連 */ };
        setInterval(cloudRefresh, 30000);
        return;
      } catch(err){}
    }
    setInterval(cloudRefresh, 15000);
  }

  /* --- B. Claude Artifact 內建資料庫 --- */
  var claudeDoc = null;

  function pushClaude(){
    if (!claudeDoc) return;
    var snap = {};
    Object.keys(picks).forEach(function(k){ snap[k] = true; });
    pendingWrites++;
    claudeDoc.set({ picks: snap, updatedAt: new Date().toISOString() }).then(function(){
      savedAt(null, "已自動儲存");
    }, function(){
      setSync("warn", "雲端儲存失敗，暫存在這台裝置");
    }).then(function(){
      pendingWrites--;
      if (pendingWrites < 0) pendingWrites = 0;
    });
  }

  function startClaude(db){
    mode = "claude";
    claudeDoc = db.doc("schedule/selections");
    var seeded = false;
    claudeDoc.onSnapshot(function(snap){
      if (pendingWrites > 0) return;
      var data = snap.exists ? snap.data() : null;
      var remote = (data && data.picks) ? data.picks : null;
      if (!seeded){
        seeded = true;
        if (!remote || !Object.keys(remote).length){
          if (Object.keys(picks).length){ save(); return; }
          setSync("ok", "已連線，勾選會自動儲存");
          return;
        }
      }
      adoptRemote(remote, data && data.updatedAt, "已自動儲存");
    }, function(){ setSync("warn", "雲端儲存失敗，暫存在這台裝置"); });
  }

  /* --- 啟動 --- */
  picks = readLocal();
  paint();

  function cloudOrLocal(){
    if (DB_URL) startCloud();
    else setSync("local", "僅存在這台裝置");
  }

  if (window.claude && typeof window.claude.use === "function"){
    /* 在 Claude Artifact 裡：外部網域被封鎖，改用 Artifact 自己的雲端資料庫 */
    setSync("wait", "連線中…");
    window.claude.use("db").then(function(db){
      if (db) startClaude(db);
      else cloudOrLocal();
    }, cloudOrLocal);
  } else if (DB_URL){
    startCloud();
  } else {
    setSync("warn", "未設定共用資料庫 — 勾選只存在這台裝置");
  }
})();
</script>
</body>
</html>
